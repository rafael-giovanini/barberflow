{% extends "base.html" %}
{% block title %}Criar senha — BarberFlow{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Criar senha</h2>
  {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
  {% if valid %}<form method="post" action="/criar-senha">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="form-group"><label for="new_password">Nova senha</label><input id="new_password" type="password" name="new_password" class="form-control" autocomplete="new-password" minlength="10" required><small>Use pelo menos 10 caracteres.</small></div>
    <div class="form-group"><label for="confirm_password">Confirmar senha</label><input id="confirm_password" type="password" name="confirm_password" class="form-control" autocomplete="new-password" minlength="10" required></div>
    <button type="submit" class="btn btn-dourado btn-block">Criar senha</button>
  </form>{% else %}<p>Solicite um novo link na página de <a href="/primeiro-acesso">primeiro acesso</a>.</p>{% endif %}
</div>
{% endblock %}
