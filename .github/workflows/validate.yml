name: Validação BarberFlow

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barberflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d barberflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BARBERFLOW_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/barberflow_test
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Validar sintaxe
        run: python -m compileall -q app.py auth.py database.py database_postgres.py db_compat.py migrate_sqlite_to_postgres.py security_routes.py smtp_settings.py seed_demo.py
      - name: Executar testes unitários
        run: python -m unittest discover -s tests -v
